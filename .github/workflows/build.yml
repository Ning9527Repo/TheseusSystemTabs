name: Build iOS deb
on:
  workflow_dispatch:
    inputs:
      targets:
        description: Package variant
        type: choice
        default: roothide
        options:
          - roothide
          - rootless
          - both
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check pinned sources and adapter
        run: python3 tests/check_source.py
      - name: Check replacement state and capsule geometry
        run: python3 tests/test_replacement.py
      - name: Check hosted production gestures
        run: python3 tests/test_hosted_compositor.py
      - name: Check platter rim antialiasing
        run: python3 tests/test_platter_edges.py
      - name: Check WeChat metadata, actions and hook idempotence
        run: python3 tests/test_wechat_adapter.py
      - name: Check Xcode Metal toolchain
        run: |
          xcodebuild -version
          if ! xcrun --sdk iphoneos metal --version; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun --sdk iphoneos metal --version
          fi
      - name: Compile, sign and verify deb
        run: python3 tools/build.py --targets "$TARGETS"
        env:
          TARGETS: ${{ inputs.targets }}
      - uses: actions/upload-artifact@v4
        with:
          name: theseus-system-tabs-${{ inputs.targets }}
          path: dist/
          if-no-files-found: error
